# Hook scripts use bash syntax, so they are run with bash explicitly:
# lefthook runs `run:` with /bin/sh, which is dash on Debian/Ubuntu.
commit-msg:
  commands:
    conventional:
      run: bash scripts/hooks/commit-msg.sh {1}

pre-commit:
  commands:
    biome-check:
      root: "."
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,jsx,tsx,json,jsonc}"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true

    file-length:
      root: "."
      glob: "*.{ts,tsx}"
      exclude: "*.{test,spec,d}.ts|*.{test,spec}.tsx|**/__tests__/**|**/tests/**|**/*.generated.*"
      run: bash scripts/hooks/file-length.sh {staged_files}

pre-push:
  commands:
    branch-name:
      run: bash scripts/hooks/branch-name.sh
