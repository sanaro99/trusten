name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  biome:
    name: runner / Biome
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: 2.4.8

      - name: Run Biome
        run: biome ci .

  typecheck:
    name: runner / Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck
        run: bun run typecheck

      - name: Check SvelteKit application
        run: bun run --filter @trusten/web check

  test:
    name: runner / Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: trusten_test
          POSTGRES_USER: trusten
          POSTGRES_PASSWORD: trusten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trusten -d trusten_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUSTEN_TEST_DATABASE_URL: postgresql://trusten:trusten_test@127.0.0.1:5432/trusten_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Component tests
        run: bun run --filter @trusten/ui test:components
