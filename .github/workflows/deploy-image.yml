name: Build and push deployment images

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: trusten_test
          POSTGRES_USER: trusten
          POSTGRES_PASSWORD: trusten_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trusten -d trusten_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUSTEN_TEST_DATABASE_URL: postgresql://trusten:trusten_test@127.0.0.1:5432/trusten_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bunx biome ci .
      - name: Typecheck packages and server
        run: bun run typecheck
      - name: Check SvelteKit application
        run: bun run --filter @trusten/web check
      - name: Unit and component tests
        run: |
          bun run test
          bun run --filter @trusten/ui test:components
      - name: Build SvelteKit application
        run: bun run build:web

  publish:
    name: Publish ${{ matrix.target }} image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - target: application
            tag_prefix: ""
          - target: proxy
            tag_prefix: proxy-
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.tag_prefix }}latest
            type=sha,format=short,prefix=${{ matrix.tag_prefix }}sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
